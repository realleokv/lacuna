name: Validar Lacuna
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-e2e.txt
      - run: python -m pytest -q
      - run: npm test
      - run: python -m playwright install --with-deps chromium
      - run: python tests/e2e/journey.py --width 390
      - run: python tests/e2e/journey.py --width 1366 --height 900 --sweep
